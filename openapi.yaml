openapi: 3.0.3

info:
  title: School Portal API
  version: 1.0.0
  description: API School Portal untuk siswa dan orang tua yang terintegrasi dengan Odoo ERP.
  contact:
    name: School Portal Development Team

servers:
  - url: http://localhost:8069
    description: Local Odoo Server

tags:

  - name: Authentication
    description: Autentikasi dan session pengguna

  - name: Dashboard
    description: Ringkasan informasi portal

  - name: Profile
    description: Biodata dan profil pengguna

  - name: Academic
    description: Jadwal, nilai dan rapor

  - name: Finance
    description: SPP dan pembayaran

  - name: Cooperative
    description: Koperasi sekolah dan pesanan

  - name: Library
    description: OPAC, peminjaman dan pengembalian buku

  - name: Attendance
    description: Kehadiran siswa

  - name: Student Notes
    description: Catatan siswa

  - name: Announcements
    description: Pengumuman sekolah


paths:

  # =========================================================
  # AUTHENTICATION
  # =========================================================

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Login pengguna
      description: Melakukan autentikasi pengguna School Portal.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"

      responses:

        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

        "401":
          description: Username atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Data login tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"


  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      operationId: getCurrentUser
      summary: Mendapatkan pengguna yang sedang login

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Data pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "401":
          description: Token tidak valid atau pengguna belum login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutUser
      summary: Logout pengguna

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # DASHBOARD
  # =========================================================

  /api/v1/dashboard:
    get:
      tags:
        - Dashboard
      operationId: getDashboard
      summary: Mendapatkan dashboard pengguna

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Dashboard berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # PROFILE
  # =========================================================

  /api/v1/profile:
    get:
      tags:
        - Profile
      operationId: getProfile
      summary: Mendapatkan profil pengguna

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Profil berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/profile/student:
    get:
      tags:
        - Profile
      operationId: getStudentProfile
      summary: Mendapatkan biodata siswa

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Biodata siswa berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfileResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "403":
          description: Pengguna tidak memiliki akses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/profile/parent/children:
    get:
      tags:
        - Profile
      operationId: getParentChildren
      summary: Mendapatkan daftar anak orang tua
      description: Mengambil daftar siswa yang terhubung dengan akun orang tua.

      security:
        - bearerAuth: []

      responses:

        "200":
          description: Data anak berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildrenResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "403":
          description: Pengguna bukan orang tua
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # ACADEMIC - SCHEDULE
  # =========================================================

  /api/v1/academic/schedules:
    get:
      tags:
        - Academic
      operationId: getSchedules
      summary: Mendapatkan jadwal pelajaran

      security:
        - bearerAuth: []

      parameters:

        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-09-30"

        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-09-01"

        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-09-30"

        - name: class_id
          in: query
          required: false
          schema:
            type: integer
          example: 10

      responses:

        "200":
          description: Jadwal berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleListResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # ACADEMIC - GRADES
  # =========================================================

  /api/v1/academic/grades:
    get:
      tags:
        - Academic
      operationId: getGrades
      summary: Mendapatkan nilai siswa

      security:
        - bearerAuth: []

      parameters:

        - name: semester
          in: query
          required: false
          schema:
            type: string
            enum:
              - ganjil
              - genap
          example: ganjil

        - name: academic_year
          in: query
          required: false
          schema:
            type: string
          example: "2026/2027"

        - name: subject_id
          in: query
          required: false
          schema:
            type: integer
          example: 5

      responses:

        "200":
          description: Nilai berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeListResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # ACADEMIC - REPORT
  # =========================================================

  /api/v1/academic/report:
    get:
      tags:
        - Academic
      operationId: getReport
      summary: Mendapatkan e-rapor siswa

      security:
        - bearerAuth: []

      parameters:

        - name: semester
          in: query
          required: true
          schema:
            type: string
            enum:
              - ganjil
              - genap
          example: ganjil

        - name: academic_year
          in: query
          required: true
          schema:
            type: string
          example: "2026/2027"

      responses:

        "200":
          description: Rapor berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/academic/report/download:
    get:
      tags:
        - Academic
      operationId: downloadReport
      summary: Download e-rapor dalam PDF

      security:
        - bearerAuth: []

      parameters:

        - name: semester
          in: query
          required: true
          schema:
            type: string
            enum:
              - ganjil
              - genap

        - name: academic_year
          in: query
          required: true
          schema:
            type: string
          example: "2026/2027"

      responses:

        "200":
          description: File e-rapor PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # FINANCE - SPP
  # =========================================================

  /api/v1/finance/spp:
    get:
      tags:
        - Finance
      operationId: getSPP
      summary: Mendapatkan tagihan SPP

      security:
        - bearerAuth: []

      parameters:

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - unpaid
              - partially_paid
              - paid

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        "200":
          description: Tagihan SPP berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SPPListResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/finance/spp/{id}:
    get:
      tags:
        - Finance
      operationId: getSPPDetail
      summary: Mendapatkan detail tagihan SPP

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1001

      responses:

        "200":
          description: Detail SPP berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SPPResponse"

        "404":
          description: Tagihan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/finance/spp/{id}/payment-proof:
    post:
      tags:
        - Finance
      operationId: uploadPaymentProof
      summary: Upload bukti pembayaran SPP

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1001

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PaymentProofRequest"

      responses:

        "201":
          description: Bukti pembayaran berhasil diunggah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProofResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Data tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"


  # =========================================================
  # COOPERATIVE - PRODUCTS
  # =========================================================

  /api/v1/cooperative/products:
    get:
      tags:
        - Cooperative
      operationId: getProducts
      summary: Mendapatkan katalog produk koperasi

      security:
        - bearerAuth: []

      parameters:

        - name: search
          in: query
          required: false
          schema:
            type: string
          example: "seragam"

        - name: category
          in: query
          required: false
          schema:
            type: string
          example: "Seragam"

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        "200":
          description: Produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/cooperative/products/{id}:
    get:
      tags:
        - Cooperative
      operationId: getProduct
      summary: Mendapatkan detail produk

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1

      responses:

        "200":
          description: Detail produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"

        "404":
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # COOPERATIVE - ORDERS
  # =========================================================

  /api/v1/cooperative/orders:
    get:
      tags:
        - Cooperative
      operationId: getOrders
      summary: Mendapatkan riwayat pesanan

      security:
        - bearerAuth: []

      parameters:

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - processed
              - ready

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        "200":
          description: Pesanan berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"


    post:
      tags:
        - Cooperative
      operationId: checkoutOrder
      summary: Checkout dan membuat pesanan
      description: Membuat pesanan koperasi berdasarkan isi cart. Pesanan dibuat sebagai draft di Odoo.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"

      responses:

        "201":
          description: Pesanan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"

        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Data pesanan tidak valid atau stok tidak mencukupi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"


  /api/v1/cooperative/orders/{id}:
    get:
      tags:
        - Cooperative
      operationId: getOrder
      summary: Mendapatkan detail pesanan

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1001

      responses:

        "200":
          description: Detail pesanan berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"

        "404":
          description: Pesanan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # LIBRARY - OPAC
  # =========================================================

  /api/v1/library/books:
    get:
      tags:
        - Library
      operationId: searchBooks
      summary: Mencari buku perpustakaan
      description: OPAC untuk mencari dan melihat ketersediaan buku.

      security:
        - bearerAuth: []

      parameters:

        - name: search
          in: query
          required: false
          schema:
            type: string
          example: "Laravel"

        - name: author
          in: query
          required: false
          schema:
            type: string
          example: "Taylor Otwell"

        - name: category
          in: query
          required: false
          schema:
            type: string
          example: "Pemrograman"

        - name: available
          in: query
          required: false
          schema:
            type: boolean
          example: true

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        "200":
          description: Buku berhasil ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"


  /api/v1/library/books/{id}:
    get:
      tags:
        - Library
      operationId: getBook
      summary: Mendapatkan detail buku

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1

      responses:

        "200":
          description: Detail buku berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"

        "404":
          description: Buku tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # LIBRARY - BORROWING
  # =========================================================

  /api/v1/library/borrowings:
    get:
      tags:
        - Library
      operationId: getBorrowings
      summary: Mendapatkan riwayat peminjaman

      security:
        - bearerAuth: []

      parameters:

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - borrowed
              - returned
              - overdue

      responses:

        "200":
          description: Peminjaman berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowingListResponse"


    post:
      tags:
        - Library
      operationId: createBorrowing
      summary: Mengajukan peminjaman buku

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBorrowingRequest"

      responses:

        "201":
          description: Peminjaman berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowingResponse"

        "422":
          description: Buku tidak tersedia atau data tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"


  /api/v1/library/borrowings/{id}:
    get:
      tags:
        - Library
      operationId: getBorrowing
      summary: Mendapatkan detail peminjaman

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:

        "200":
          description: Detail peminjaman berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowingResponse"

        "404":
          description: Peminjaman tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/v1/library/borrowings/{id}/return:
    post:
      tags:
        - Library
      operationId: returnBorrowing
      summary: Mengembalikan buku
      description: Mengembalikan buku yang sedang dipinjam.

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:

        "200":
          description: Buku berhasil dikembalikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowingResponse"

        "400":
          description: Buku tidak dapat dikembalikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # ATTENDANCE
  # =========================================================

  /api/v1/attendance:
    get:
      tags:
        - Attendance
      operationId: getAttendance
      summary: Mendapatkan data kehadiran

      security:
        - bearerAuth: []

      parameters:

        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-09-01"

        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-09-30"

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - present
              - sick
              - permission
              - absent

      responses:

        "200":
          description: Kehadiran berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceListResponse"


  # =========================================================
  # STUDENT NOTES
  # =========================================================

  /api/v1/student-notes:
    get:
      tags:
        - Student Notes
      operationId: getStudentNotes
      summary: Mendapatkan catatan siswa

      security:
        - bearerAuth: []

      parameters:

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

      responses:

        "200":
          description: Catatan siswa berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentNoteListResponse"


  # =========================================================
  # ANNOUNCEMENTS
  # =========================================================

  /api/v1/announcements:
    get:
      tags:
        - Announcements
      operationId: getAnnouncements
      summary: Mendapatkan pengumuman

      security:
        - bearerAuth: []

      parameters:

        - name: search
          in: query
          required: false
          schema:
            type: string

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        "200":
          description: Pengumuman berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementListResponse"


  /api/v1/announcements/{id}:
    get:
      tags:
        - Announcements
      operationId: getAnnouncement
      summary: Mendapatkan detail pengumuman

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:

        "200":
          description: Detail pengumuman berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementResponse"

        "404":
          description: Pengumuman tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


# ============================================================
# COMPONENTS
# ============================================================

components:

  # ==========================================================
  # SECURITY
  # ==========================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ==========================================================
  # SCHEMAS
  # ==========================================================

  schemas:

    # ========================================================
    # AUTHENTICATION
    # ========================================================

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:

        username:
          type: string
          example: "20260001"

        password:
          type: string
          format: password
          example: "password123"


    LoginResponse:
      type: object
      required:
        - success
